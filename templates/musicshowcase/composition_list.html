<!DOCTYPE html>
<html>
<head>
    <title>My Compositions</title>
</head>
<body>
    <h1>My Musical Compositions</h1>
    <ul>
        {% for composition in compositions %}
            <li>
                <h2>{{ composition.title }}</h2>
                <p>{{ composition.description }}</p>
                <audio controls>
                    <source src="{{ composition.audio_file.url }}" type="audio/mpeg">
                    Your browser does not support the audio element.
                </audio>
            </li>
        {% endfor %}
    </ul>
</body>
</html>
