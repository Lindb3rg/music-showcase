<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <style>
        body {
            background-color: black; /* Set background to black */
            color: white; /* Set text color to white */
        }
        .w3-container {
            background-color: rgba(0, 0, 0, 0.8); /* Slightly transparent black for the container */
            padding: 30px; /* Add some padding for better layout */
            border-radius: 8px; /* Add some rounding to the corners */
            margin: 50px auto; /* Center the container */
            max-width: 400px; /* Limit the width */
        }
        input {
            background-color: #333; /* Darker input background */
            color: white; /* Input text color */
            border: 1px solid #555; /* Input border color */
        }
        input::placeholder {
            color: #bbb; /* Placeholder text color */
        }
        button {
            background-color: #ff6e42; /* Bootstrap green button */
        }
    </style>
</head>
<body>

    <div class="w3-container">
        <h2 class="w3-wide text-center">Login</h2>
        <form action="{% url 'musicshowcase:user_login' %}" method="POST" autocomplete="off">
            {% csrf_token %}
            <label for="username">Username:</label>
            <p><input class="w3-input w3-border" name="username" type="text" placeholder="Enter username"></p>
            
            <label for="password">Password:</label>
            <p><input class="w3-input w3-border" name="password" type="password" placeholder="Enter password"></p>

            <button type="submit" class="w3-button w3-padding-large w3-green w3-margin-bottom" value="login">Login</button>
        </form>
    </div>

</body>
</html>
